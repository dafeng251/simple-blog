root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/blog-server"
  cmd = "go build -o ./tmp/blog-server ./cmd/main.go"
  delay = 1000
  exclude_dir = ["tmp", "uploads", "vendor"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = 500
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
